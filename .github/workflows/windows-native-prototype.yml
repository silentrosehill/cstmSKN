name: Windows LTK integration
on:
  push:
    branches: [windows-manager-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use current stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
      - name: Prepare complete official companion installer
        run: python scripts/prepare-ltk-companion.py --test-fixture
      - name: Collect notices for the configured app resources
        run: python scripts/windows-license-notices.py
      - name: Check app/LTK protocol and regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Probe official LTK host protocol without a game
        run: ./scripts/test-official-ltk-host.ps1
