name: Windows preview
on:
  push:
    branches: [main, ltk-integration, windows-engine-loading, windows-manager-integration]
  workflow_dispatch:
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Use current stable Rust
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and test source-native Windows engine
        run: python scripts/prepare-native-windows-engine.py
      - name: Include complete official LTK installer with original signature
        run: |
          python scripts/prepare-ltk-companion.py
          $installer = 'src-tauri/resources/ltk-companion/LTK.Manager_1.30.4_x64-setup.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $installer).Status -ne 'Valid') { throw 'Official LTK installer signature is invalid' }
      - name: Frontend regression tests
        run: npm test
      - name: Windows native regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Verify companion discovery and duplicate-launch detection
        run: ./scripts/test-ltk-companion-discovery.ps1
      - name: Collect open-source license notices
        run: python scripts/windows-license-notices.py
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis
      - name: Verify package and document provenance
        run: |
          New-Item -ItemType Directory -Force release-windows | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-windows/cstmSKN-Windows-x64-setup.exe
          Copy-Item src-tauri/resources/windows/provenance.json release-windows/engine-provenance.json
          Copy-Item src-tauri/resources/ltk-companion/provenance.json release-windows/ltk-companion-provenance.json
          Copy-Item licenses/GPL-3.0.txt release-windows/LICENSE.txt
          Copy-Item WINDOWS.md release-windows/
          git archive --format=zip --output=release-windows/cstmSKN-Windows-source.zip HEAD
          $installer = Get-Item release-windows/cstmSKN-Windows-x64-setup.exe
          if ($installer.Length -lt 1000000) { throw 'Installer is unexpectedly small' }
          # Portable build: the app plus its engine folder, no installer needed.
          New-Item -ItemType Directory -Force portable/cstmSKN/native | Out-Null
          Copy-Item src-tauri/target/release/cstmSKN.exe portable/cstmSKN/
          Copy-Item src-tauri/resources/windows/* portable/cstmSKN/native/
          Copy-Item -Recurse src-tauri/resources/ltk-companion portable/cstmSKN/ltk-companion
          $companion = 'portable/cstmSKN/ltk-companion/LTK.Manager_1.30.4_x64-setup.exe'
          $expected = '0007230f8772c846d586f456aedee5846f7dbf4719715940e73bb073ae4eff23'
          if ((Get-FileHash -LiteralPath $companion -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Portable app did not preserve the official installer' }
          Copy-Item WINDOWS.md portable/cstmSKN/
          $portableExe = (Resolve-Path portable/cstmSKN/cstmSKN.exe).Path
          $stub = Start-Process $portableExe -PassThru
          Start-Sleep -Seconds 10
          # A shell-launched copy replaces the original process. Verify the
          # actual GUI process at the packaged path rather than the launch stub.
          $running = @(Get-Process cstmSKN -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $portableExe })
          if ($running.Count -ne 1) { throw "Expected one running portable GUI, found $($running.Count)" }
          if ($running[0].MainWindowHandle -eq 0) { throw "Portable GUI did not show its window" }
          $running | Stop-Process -Force
          Compress-Archive -Path portable/cstmSKN -DestinationPath release-windows/cstmSKN-Windows-x64-portable.zip
          Copy-Item src-tauri/resources/windows/THIRD-PARTY-NOTICES.md release-windows/
          $sums = Get-FileHash release-windows/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $sums | Out-File -Encoding ascii release-windows/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cstmSKN-Windows-native-integrated
          path: release-windows/*
          if-no-files-found: error
          retention-days: 30
