[package]
name = "cstmskn"
version = "1.0.2"
description = "A lightweight desktop app to browse and apply League of Legends skins."
authors = ["you"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "cstmskn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
ureq = "2"
libc = "0.2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
camino = "1"
ltk_overlay = "=0.17.0"
# Match LTK Manager's own lockfile: zip 2.6 changes the ZipFile reader API.
zip_ltk = { package = "zip", version = "=2.4.2" }
winreg = "0.55"
sha2 = "0.10"

# GPL LTK desktop shell-launch adapter (normal Explorer COM activation).
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"] }
windows-sys = { version = "0.59", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_Kernel", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
